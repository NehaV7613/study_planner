<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom Styling */
        body {
            background: linear-gradient(135deg, #f8c8dc, #b3d9ff); /* Soft pink & blue pastel */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            color: #5a5a5a;
        }

        .form-control {
            border-radius: 8px;
        }

        .btn-primary {
            background-color: #ffa8b6; /* Soft pastel pink */
            border: none;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background-color: #ff85a2;
        }

        .back-link {
            color: #6c757d;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="login-container text-center">
                    <h2>Student Login</h2>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger py-2">{{ message }}</div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            {% comment %}
                                <label for="student_id" class="form-label">Username</label>
                            {% endcomment %}
                            <input type="text" name="student_id" id="student_id" class="form-control" placeholder="Enter your Student ID" required>
                        </div>

                        <div class="mb-3">
                            {% comment %}
                                <label for="password" class="form-label">Password</label>
                            {% endcomment %}
                            <input type="password" name="password" id="password" class="form-control" placeholder="Enter your Password" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>

                    <div class="mt-3">
                        <a href="{% url 'index' %}" class="back-link">Back to Homepage</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
