{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'assets/css/to_do.css' %}">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">To-Do List</h1>
        <div class="card shadow">
            <div class="card-body">
                <!-- Task Form -->
                <form id="taskForm" method="post" action="{% url 'student_add_task' %}">
                    {% csrf_token %}
                    <div class="form-group">
                        <input type="text" class="form-control" id="taskInput" name="description" placeholder="Add your task" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Add Task</button>
                </form>

                <!-- Task List -->
                <ul id="taskList" class="list-group mt-3">
                    {% for task in tasks %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span class="{% if task.completed %}completed{% endif %}">{{ task.description }}</span>
                        <div>
                            <a href="{% url 'student_toggle_task' task.id %}" class="btn btn-sm btn-success mr-2">
                                {% if task.completed %}Undo{% else %}Complete{% endif %}
                            </a>
                            <a href="{% url 'student_delete_task' task.id %}" class="btn btn-sm btn-danger">Delete</a>
                        </div>
                    </li>
                    {% empty %}
                    <li class="list-group-item text-center text-muted">No tasks added yet.</li>
                    {% endfor %}
                </ul>
            </div>
            <a href="{% url 'student_dashboard' %}" class="btn btn-primary">Back to student Dashboard</a>
        </div>
    </div>

    <!-- Bootstrap JS and jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- Custom JS -->
    <script src="{% static 'scripts.js' %}"></script>
</body>
</html>
