{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: url('{% static "studybg.jpeg" %}') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pomodoro-container {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 300px;
        }

        .pomodoro-header {
            font-size: 1.2rem;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pomodoro-header .dots {
            display: flex;
            gap: 5px;
        }

        .pomodoro-header .dots span {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
        }

        .timer {
            font-size: 3rem;
            margin: 20px 0;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .controls button {
            background: #333;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s ease;
        }

        .controls button:hover {
            background: #555;
        }

        .modes {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .modes div {
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        .modes div:hover {
            background: #555;
        }

        .settings {
            margin-top: 15px;
            font-size: 0.8rem;
            cursor: pointer;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="pomodoro-container">
        <div class="pomodoro-header">
            <span>Personal</span>
            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <div class="timer" id="timer">30:00</div>

        <div class="controls">
            <button id="startPauseBtn">Start</button>
            <button id="resetBtn">⟳</button>
        </div>

        <div class="modes">
            <div id="shortBreak">Short Break</div>
            <div id="longBreak">Long Break</div>
        </div>

        <div class="settings">⚙ Settings</div>
    </div>

    <script>
        let timeLeft = 30 * 60; // 30 minutes in seconds
        let timer;
        let isRunning = false;
        let currentMode = "work"; // "work", "shortBreak", "longBreak"

        const timerDisplay = document.getElementById("timer");
        const startPauseBtn = document.getElementById("startPauseBtn");
        const resetBtn = document.getElementById("resetBtn");
        const shortBreakBtn = document.getElementById("shortBreak");
        const longBreakBtn = document.getElementById("longBreak");

        function updateDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            timerDisplay.innerText = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
        }

        function startPauseTimer() {
            if (isRunning) {
                clearInterval(timer);
                startPauseBtn.innerText = "Start";
            } else {
                timer = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timer);
                        alert("Time's up!");
                    }
                }, 1000);
                startPauseBtn.innerText = "Pause";
            }
            isRunning = !isRunning;
        }

        function resetTimer() {
            clearInterval(timer);
            isRunning = false;
            startPauseBtn.innerText = "Start";
            if (currentMode === "work") {
                timeLeft = 30 * 60;
            } else if (currentMode === "shortBreak") {
                timeLeft = 5 * 60;
            } else {
                timeLeft = 15 * 60;
            }
            updateDisplay();
        }

        function switchMode(mode) {
            clearInterval(timer);
            isRunning = false;
            startPauseBtn.innerText = "Start";
            if (mode === "shortBreak") {
                timeLeft = 5 * 60;
            } else if (mode === "longBreak") {
                timeLeft = 15 * 60;
            } else {
                timeLeft = 30 * 60;
            }
            currentMode = mode;
            updateDisplay();
        }

        startPauseBtn.addEventListener("click", startPauseTimer);
        resetBtn.addEventListener("click", resetTimer);
        shortBreakBtn.addEventListener("click", () => switchMode("shortBreak"));
        longBreakBtn.addEventListener("click", () => switchMode("longBreak"));

        updateDisplay();
    </script>
</body>
</html>
