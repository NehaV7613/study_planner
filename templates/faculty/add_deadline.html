<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container-fluid">
    <!-- Header -->
    <header class="bg-primary text-white text-center py-4">
      <h1>Faculty Dashboard</h1>
    </header>

    <!-- Main Content -->
    <div class="row mt-4">
      <!-- Left Sidebar: Post Deadlines and Remarks -->
      <div class="col-md-4">
        <!-- Post Deadlines Section -->
        <div class="card mb-4">
          <div class="card-header bg-success text-white">
            <h5 class="card-title mb-0">Post Deadlines</h5>
          </div>
          <div class="card-body">
            <form method="post" action="{% url 'add_deadline' %}">
              {% csrf_token %}
              <div class="mb-3">
                <label for="task" class="form-label">Task</label>
                <select class="form-select" id="task" name="task" required>
                  <option value="" selected disabled>Select a task</option>
                  {% for task in tasks %}
                    <option value="{{ task.id }}">{{ task.name }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="mb-3">
                <label for="student" class="form-label">Student</label>
                <select class="form-select" id="student" name="student" required>
                  <option value="" selected disabled>Select a student</option>
                  {% for student in students %}
                    <option value="{{ student.id }}">{{ student.username }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="mb-3">
                <label for="due_date" class="form-label">Due Date</label>
                <input type="datetime-local" class="form-control" id="due_date" name="due_date" required>
              </div>
              <button type="submit" class="btn btn-success">Add Deadline</button>
            </form>
          </div>
        </div>

    </body>
</html>
